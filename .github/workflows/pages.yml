name: Game IO website

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/scripts/check-site.cjs'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/scripts/check-site.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install browser for site checks
        run: |
          qa="$RUNNER_TEMP/gameio-site-qa"
          npm install --ignore-scripts --no-audit --no-fund --no-save --prefix "$qa" playwright@1.65.0
          "$qa/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
      - name: Check website and capture previews
        run: |
          export NODE_PATH="$RUNNER_TEMP/gameio-site-qa/node_modules"
          node .github/scripts/check-site.cjs "$RUNNER_TEMP/site-preview"
      - name: Upload website previews
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview
          path: ${{ runner.temp }}/site-preview/
          if-no-files-found: ignore
          retention-days: 7
      - name: Package static website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
